openapi: "3.0.0"
info:
  title: Paws and Homes API
  version: "1.0"
paths:
  /api/pets:
    get:
      summary: Get all pets
      responses:
        "200":
          description: List of pets
    post:
      summary: Create a pet
      responses:
        "201":
          description: Pet created
  /api/pets/{id}:
    delete:
      summary: Delete a pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pet deleted